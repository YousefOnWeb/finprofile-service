spring:
  datasource:
    url: jdbc:h2:mem:finprofiledb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Application configuration
finprofile:
  default-page-size: 20

logging:
  level:
    com.financial.profile: INFO
